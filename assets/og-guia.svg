<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a211a"/>
      <stop offset="46%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#e2b56a" stop-opacity="0.34"/>
      <stop offset="38%" stop-color="#8a5a22" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8a5a22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0.15" y2="0">
      <stop offset="0%" stop-color="#8d5e28"/>
      <stop offset="46%" stop-color="#e2b56a"/>
      <stop offset="100%" stop-color="#f8e7c4"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3d5c48"/>
      <stop offset="100%" stop-color="#c5ddd0"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7a4634"/>
      <stop offset="100%" stop-color="#f0c8b8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#322b23"/>
      <stop offset="100%" stop-color="#191511"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1048" cy="78" r="150" fill="none" stroke="#e2b56a" stroke-width="1.25" opacity="0.28"/>
  <circle cx="1048" cy="78" r="98" fill="#e2b56a" opacity="0.05"/>
  <circle cx="150" cy="548" r="72" fill="#e2b56a" opacity="0.045"/>
  <rect width="8" height="630" fill="url(#gold)"/>

  <g fill="#e2b56a">
    <circle cx="78" cy="548" r="1.4" opacity="0.45"/>
    <circle cx="108" cy="568" r="1.4" opacity="0.3"/>
    <circle cx="142" cy="540" r="1.4" opacity="0.22"/>
    <circle cx="176" cy="574" r="1.4" opacity="0.34"/>
    <circle cx="214" cy="552" r="1.4" opacity="0.18"/>
  </g>

  <text x="64" y="92" fill="#e2b56a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" letter-spacing="2.4">GUIA DE CUSTOS</text>

  <text x="60" y="172" fill="#f7f1e7" font-family="Gentium Plus, DejaVu Serif, Georgia, serif" font-size="68" font-weight="700">Custos dos</text>
  <text x="60" y="248" fill="#f7f1e7" font-family="Gentium Plus, DejaVu Serif, Georgia, serif" font-size="68" font-weight="700">modelos de <tspan fill="#e2b56a">IA</tspan></text>

  <rect x="64" y="272" width="84" height="4" rx="2" fill="url(#gold)"/>
  <text x="64" y="316" fill="#d9cbb8" font-family="DejaVu Sans, sans-serif" font-size="21">Comparativo para revisão de código.</text>
  <text x="64" y="346" fill="#d9cbb8" font-family="DejaVu Sans, sans-serif" font-size="21">Escolha o modelo pelo preço e pela tarefa.</text>

  <g font-family="DejaVu Sans, sans-serif" font-size="18" fill="#f7f1e7">
    <circle cx="74" cy="392" r="4" fill="#e2b56a"/>
    <text x="92" y="398">OpenAI, Anthropic e Google</text>
    <circle cx="74" cy="432" r="4" fill="#e2b56a"/>
    <text x="92" y="438">USD por milhão de tokens, entrada e saída</text>
    <circle cx="74" cy="472" r="4" fill="#e2b56a"/>
    <text x="92" y="478">API direta versus créditos do Copilot</text>
  </g>

  <text x="64" y="568" fill="#b7a894" font-family="DejaVu Sans, sans-serif" font-size="17">ia.guia.lcadev.com.br</text>

  <rect x="756" y="74" width="384" height="492" rx="28" fill="#000" opacity="0.28"/>
  <rect x="740" y="54" width="396" height="506" rx="28" fill="url(#panel)" stroke="#6d5a40" stroke-width="1.4"/>
  <path d="M768 54h92v3H768z" fill="url(#gold)"/>

  <text x="772" y="104" fill="#e2b56a" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">O QUE O GUIA COMPARA</text>
  <text x="770" y="146" fill="#f7f1e7" font-family="Gentium Plus, DejaVu Serif, Georgia, serif" font-size="30" font-weight="700">Quatro decisões</text>
  <line x1="772" y1="170" x2="1104" y2="170" stroke="#3f342b"/>

  <g font-family="DejaVu Sans, sans-serif">
    <circle cx="786" cy="206" r="5" fill="#e2b56a"/>
    <text x="806" y="212" fill="#f7f1e7" font-size="16" font-weight="700">Preço por modelo</text>
    <text x="806" y="234" fill="#cbbba6" font-size="14">entrada e saída, em dólares</text>

    <circle cx="786" cy="278" r="5" fill="#8faf9c"/>
    <text x="806" y="284" fill="#f7f1e7" font-size="16" font-weight="700">Copilot e API</text>
    <text x="806" y="306" fill="#cbbba6" font-size="14">créditos do plano ou tarifa direta</text>

    <circle cx="786" cy="350" r="5" fill="#d7a08e"/>
    <text x="806" y="356" fill="#f7f1e7" font-size="16" font-weight="700">Tipo de revisão</text>
    <text x="806" y="378" fill="#cbbba6" font-size="14">triagem, bug difícil, muito contexto</text>

    <circle cx="786" cy="422" r="5" fill="#e2b56a"/>
    <text x="806" y="428" fill="#f7f1e7" font-size="16" font-weight="700">Como economizar</text>
    <text x="806" y="450" fill="#cbbba6" font-size="14">menos tokens, sem perder a análise</text>
  </g>
  <text x="772" y="520" fill="#8f8274" font-family="DejaVu Sans, sans-serif" font-size="13">Estimativas de referência, não cotação.</text>
