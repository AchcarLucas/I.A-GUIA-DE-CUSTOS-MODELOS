<!DOCTYPE html>

<head>

  <meta property="og:url" content="https://ia.guia.lcadev.com.br/">
  <meta property="og:title" content="Guia de custos de modelos de IA">
  <meta property="og:description" content="Preço por token, créditos do Copilot e critérios para escolher o modelo certo.">
  <meta property="og:image" content="https://ia.guia.lcadev.com.br/assets/og-guia.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Guia de custos de modelos de IA">
  <meta name="twitter:description" content="Preço por token, créditos do Copilot e quando cada modelo vale a pena.">
  <meta name="twitter:image" content="https://ia.guia.lcadev.com.br/assets/og-guia.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1712;
      --muted: #7a6e62;
      --paper: #f6f1e8;
      --surface: #fffaf4;
      --line: #e4d5c3;
      --accent: #b8863d;
      --deep: #14110e;
      --gold: #e2b56a;
      --cream: #f7f1e7;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(880px 360px at 100% -10%, #efe2cf 0%, transparent 58%),
        var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px clamp(18px, 4vw, 56px);
      background: var(--deep);
      color: var(--cream);
      box-shadow: inset 0 -1px 0 #3a3126;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .mark {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
    }

    .identity { min-width: 0; }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--gold);
      font: 700 11px/1.2 Arial, sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--cream);
      font-size: clamp(18px, 2vw, 25px);
      font-weight: 500;
      line-height: 1.15;
    }

    .tagline {
      margin: 5px 0 0;
      color: #cbbba6;
      font: 13px/1.35 Arial, sans-serif;
    }

    .actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
      font-family: Arial, sans-serif;
    }

    .actions a {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid #4a3f32;
      border-radius: 999px;
      color: var(--cream);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .actions a:hover { background: #2a241c; border-color: #6a5a46; }
    .actions a.primary {
      border-color: var(--gold);
      background: linear-gradient(180deg, #f3ddb0, #d7a85a);
      color: var(--deep);
    }
    .actions a.primary:hover { background: #f0d7a6; }
    .actions svg { width: 16px; height: 16px; }

    main {
      min-height: 0;
      display: flex;
      padding: 18px clamp(12px, 2.2vw, 30px) 24px;
    }

    .reader {
      flex: 1;
      width: 100%;
      min-height: 420px;
      overflow: hidden;
      border: 1px solid #e0d2c0;
      border-radius: 12px;
      background: #e7ddd0;
      box-shadow: 0 18px 40px rgb(28 23 18 / 10%);
    }

    .reader iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .fallback {
      padding: 24px;
      color: var(--ink);
      font: 15px/1.5 Arial, sans-serif;
    }

    .fallback a { color: var(--accent); }

    @media (max-width: 600px) {
      .masthead { align-items: flex-start; flex-direction: column; gap: 14px; }
      .actions { width: 100%; }
      .actions a { flex: 1; padding: 0 8px; }
      main { padding: 10px; }
      .reader { min-height: 360px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <svg class="mark" viewBox="0 0 42 42" aria-hidden="true">
          <rect width="42" height="42" rx="12" fill="#2a241c"/>
          <rect x="9" y="18" width="6" height="14" rx="3" fill="#8faf9c"/>
          <rect x="18" y="10" width="7" height="22" rx="3.5" fill="#e2b56a"/>
          <rect x="28" y="20" width="6" height="12" rx="3" fill="#d7a08e"/>
        </svg>
        <div class="identity">
          <p class="eyebrow">Guia de custos · última versão</p>
          <h1>Custos de modelos de IA</h1>
          <p class="tagline">Preço por token, Copilot e APIs</p>
        </div>
      </div>
      <nav class="actions" aria-label="Ações do documento">
        <a href="guia_copilot_modelos_custos-detalhado-latest.pdf" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
          Abrir PDF
        </a>
        <a class="primary" href="guia_copilot_modelos_custos-detalhado-latest.pdf" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 17v3h16v-3"/></svg>
          Baixar
        </a>
        <a href="https://github.com/AchcarLucas/I.A-GUIA-DE-CUSTOS-MODELOS" target="_blank" rel="noopener noreferrer">
          Projeto no GitHub
        </a>
      </nav>
    </header>
    <main>
      <section class="reader" aria-label="Leitor do guia em PDF">
        <iframe
          src="guia_copilot_modelos_custos-detalhado-latest.pdf#view=FitH"
          title="Guia de custos de modelos de IA, última versão"
        >
          <div class="fallback">
            Seu navegador não conseguiu exibir o PDF aqui.
            <a href="guia_copilot_modelos_custos-detalhado-latest.pdf">Abra o documento diretamente</a>.
          </div>
        </iframe>
      </section>
    </main>
  </div>
</body>
</html>
